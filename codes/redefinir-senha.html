<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b1fa6">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/icone-192.png">
    <title>Recuperar senha — UpLearn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="uplearn.css">
    <script src="acess.js"></script>
</head>

<body>
    <a class="skip-link" href="#conteudo">Pular para o formulário</a>

    <div class="auth">
        <div class="auth__topo">
            <a class="marca" href="index.html" aria-label="UpLearn, voltar para o início"><img src="img/logo.png" alt=""></a>
            <span class="pers pers--anima" data-p="circulo azul surpreso acena"></span>
        </div>

        <main class="auth__folha" id="conteudo">
            <div class="auth__miolo">
                <h1>Recuperar senha</h1>
                <p class="subtitulo" id="subtituloPasso">Digite o e-mail da sua conta. Vamos mostrar a pergunta de segurança que você escolheu.</p>

                <div id="avisoRedefinir" class="cu-notificacao-area"></div>

                <form id="passo1" novalidate>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="nome@exemplo.com" required>
                        <p class="campo__erro" id="email-erro" role="alert"></p>
                    </div>
                    <button class="btn btn--primario btn--bloco" type="submit" id="btnPasso1">Continuar <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                </form>

                <form id="passo2" novalidate hidden>
                    <div class="campo">
                        <span class="rotulo">Pergunta de segurança</span>
                        <p class="card" id="textoPergunta" style="padding:14px 16px"></p>
                    </div>

                    <div class="campo">
                        <label for="resposta">Sua resposta</label>
                        <input type="text" id="resposta" autocomplete="off" required>
                        <p class="campo__erro" id="resposta-erro" role="alert"></p>
                    </div>

                    <div class="campo">
                        <label for="novaSenha">Nova senha</label>
                        <div class="senha-wrap">
                            <input type="password" id="novaSenha" autocomplete="new-password" placeholder="Pelo menos 6 caracteres" required>
                            <button type="button" aria-label="Mostrar senha" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
                        </div>
                        <p class="campo__erro" id="novaSenha-erro" role="alert"></p>
                    </div>

                    <button class="btn btn--primario btn--bloco" type="submit" id="btnPasso2">Salvar nova senha</button>
                </form>

                <p class="auth__rodape"><a href="login.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o login</a></p>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="sessao.js"></script>
    <script src="personagens.js"></script>
    <script src="notificacao.js"></script>
    <script src="app.js"></script>
    <script src="redefinir-senha.js"></script>
</body>

</html>
